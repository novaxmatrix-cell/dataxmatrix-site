<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Iris">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{siteUrl}}/assets/img/og.png">
<meta property="og:image:secure_url" content="{{siteUrl}}/assets/img/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="شعار Iris – إدارة المدرسة كلها في برنامج واحد">
<meta property="og:locale" content="ar_AR">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{siteUrl}}/assets/img/og.png">
<meta name="theme-color" content="#0F766E">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/img/logo.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
<script>try{var t=localStorage.getItem('theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<link rel="stylesheet" href="/assets/css/site.css?v={{assetVersion}}">
</head>
<body>
<a class="skip" href="#main">تخطَّ إلى المحتوى</a>
<header><div class="wrap">
 <a class="brand" href="/"><img src="/assets/img/logo.png" width="36" height="36" alt="">Iris</a>
 <nav id="site-nav" aria-label="القائمة الرئيسية">
{{nav}}
 </nav>
 <div class="hdr-end">
  <a class="btn bp" href="/download/">تنزيل Iris</a>
  <button class="icon-btn" id="theme-btn" type="button" aria-label="تبديل الوضع الليلي">☾</button>
  <button class="icon-btn menu" id="menu-btn" type="button" aria-label="القائمة" aria-controls="site-nav" aria-expanded="false">☰</button>
 </div>
</div></header>

<main id="main">
{{content}}
</main>

<footer><div class="wrap">
 <span>© {{year}} DataX Matrix · Iris</span>
 <nav aria-label="روابط التذييل"><a href="/guide/">دليل الاستخدام</a><a href="/files/">النماذج والأسئلة</a><a href="/contact/">تواصل معنا</a></nav>
 <span>فلسطين</span>
</div></footer>
<script src="/assets/js/site.js?v={{assetVersion}}" defer></script>
</body>
</html>
